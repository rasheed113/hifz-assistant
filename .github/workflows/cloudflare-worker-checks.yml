name: Cloudflare Worker checks

on:
  push:
    branches:
      - feat/cloudflare-qf-content-proxy
    paths:
      - "backend/cloudflare-worker/**"
      - ".github/workflows/cloudflare-worker-checks.yml"
  pull_request:
    branches:
      - feat/android-foundation
    paths:
      - "backend/cloudflare-worker/**"
      - ".github/workflows/cloudflare-worker-checks.yml"

permissions:
  contents: read

jobs:
  worker:
    name: Build Worker bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Wrangler bundle
        run: npx --yes wrangler@4 deploy --dry-run --config backend/cloudflare-worker/wrangler.jsonc
