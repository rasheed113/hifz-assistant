name: Deploy Hifz Assistant Worker

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch containing the reviewed Worker implementation"
        required: true
        type: choice
        options:
          - feat/android-foundation
        default: feat/android-foundation

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Quran Foundation proxy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed Worker source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: backend/cloudflare-worker
          command: deploy --keep-vars
