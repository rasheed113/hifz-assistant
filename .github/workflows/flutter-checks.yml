name: Flutter checks

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: Analyze, test and build Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform wrapper
        run: flutter create --platforms=android --org org.hifzassistant --project-name hifz_assistant .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Print formatter output for Quran foundation files
        run: dart format --output=show lib/features/quran/data/quran_catalog_repository.dart lib/features/quran/presentation/quran_library_page.dart lib/l10n/app_localizations.dart test/quran_catalog_test.dart

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run widget tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hifz-assistant-android-debug
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
